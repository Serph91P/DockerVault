[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.95
include-dev = true
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Zlib"]

# Unmodified Mozilla Fernet implementation; retain MPL notice/source in distributions.
[[licenses.exceptions]]
name = "fernet"
version = "=0.2.2"
allow = ["MPL-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/transact-rs/sqlx"]
