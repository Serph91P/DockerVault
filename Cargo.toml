[workspace]
members = ["crates/dockervault-core", "crates/dockervault-service", "crates/dockervault-tools"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/Serph91P/DockerVault"

[workspace.dependencies]
quick-xml = { version = "=0.42.0", default-features = false }
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "stream"] }
tar = { version = "=0.4.46", default-features = false }
flate2 = "=1.1.11"
signal-hook = { version = "=0.4.6", default-features = false }
age = { git = "https://github.com/str4d/rage", rev = "b5b68c4f4f7ea5c368bc060f6fe0237549c3a13f", default-features = false, features = ["armor"] }
zeroize = "=1.9.1"
openssl = "=0.10.82"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
fernet = "=0.2.2"
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink", "async-await"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
base64 = "=0.22.1"
bcrypt = "=0.19.3"
getrandom = "=0.3.4"
sha2 = { version = "=0.11.1", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
dotenvy = "=0.15.7"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal", "dir", "fs", "user"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "arbitrary_precision", "float_roundtrip"] }
sqlx = { version = "=0.9.0", git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["runtime-tokio", "sqlite"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["backup", "hooks"] }
tokio = { version = "=1.54.1", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.20", default-features = false, features = ["rt"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "registry"] }

# Upstream replacement of unmaintained basic-toml; no advisory waiver.
[patch.crates-io]
i18n-config = { git = "https://github.com/kellpossible/cargo-i18n", rev = "44b6e5a69d56df5918a860623180db2834680666" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "symbols"
