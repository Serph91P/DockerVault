[package]
name = "dockervault-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aws-smithy-types.workspace = true
aws-sdk-s3.workspace = true
zeroize.workspace = true
quick-xml.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
futures-util.workspace = true
md-5 = { version = "=0.11.0", default-features = false }
zip = { version = "=9.7.0", default-features = false, features = ["deflate-flate2"] }
tar.workspace = true
flate2.workspace = true
bollard.workspace = true
indexmap.workspace = true
base64.workspace = true
bcrypt.workspace = true
getrandom.workspace = true
sha2.workspace = true
time = { workspace = true, features = ["macros"] }
dotenvy.workspace = true
axum.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
rusqlite.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dockervault-core = { path = "../dockervault-core" }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
bech32.workspace = true
dockervault-tools = { path = "../dockervault-tools" }
nix = { workspace = true, features = ["inotify"] }
tokio-tungstenite.workspace = true

[[example]]
name = "docker_lifecycle"
path = "tests/bin/docker_lifecycle.rs"

[[example]]
name = "privileged_archive_supervision"
path = "tests/bin/privileged_archive_supervision.rs"

[[example]]
name = "rclone_managed"
path = "tests/bin/rclone_managed.rs"

[[example]]
name = "rclone_capabilities"
path = "tests/bin/rclone_capabilities.rs"

[[test]]
name = "auth_process"
harness = false

[[test]]
name = "migration_crash"
harness = false

[[test]]
name = "process_parent_death"
harness = false
