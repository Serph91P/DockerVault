name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      docker:
        image: docker:dind
        options: --privileged
        
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version-file: '.python-version'
        
    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip==25.3
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Run backend tests with coverage
      working-directory: backend
      run: |
        pytest --cov=app --cov-report=xml --cov-report=html
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        token: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Archive coverage report
      uses: actions/upload-artifact@v7
      with:
        name: backend-coverage-report
        path: backend/htmlcov/

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version-file: '.node-version'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install pinned npm
      working-directory: frontend
      run: npm install --global "$(node -p "require('./package.json').packageManager")"
        
    - name: Install dependencies
      working-directory: frontend
      run: npm ci
      
    - name: Run frontend tests with coverage
      working-directory: frontend
      run: npm run test:coverage -- --run
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: ./frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage
        token: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Archive coverage report
      uses: actions/upload-artifact@v7
      with:
        name: frontend-coverage-report
        path: frontend/coverage/

  lint-and-typecheck:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version-file: '.python-version'
        
    - name: Set up Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version-file: '.node-version'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install Python dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip==25.3
        pip install ruff mypy
        pip install -r requirements.txt

    - name: Install pinned npm
      working-directory: frontend
      run: npm install --global "$(node -p "require('./package.json').packageManager")"
        
    - name: Install Node dependencies
      working-directory: frontend
      run: npm ci
      
    - name: Lint Python code
      working-directory: backend
      run: ruff check app/
      
    - name: Check Python formatting
      working-directory: backend
      run: ruff format --check app/
      
    - name: Type check Python code
      working-directory: backend
      run: mypy app/
      continue-on-error: true
      
    - name: Lint TypeScript code
      working-directory: frontend
      run: npm run lint
      
    - name: Type check TypeScript code
      working-directory: frontend
      run: npx tsc --noEmit

  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Build Docker image
      run: |
        docker build -t dockervault:test .

    - name: Check runtime binaries
      run: |
        docker run --rm --entrypoint /bin/bash dockervault:test -o pipefail -c '
          set -eu
          for binary in rclone rsync ssh sftp sshpass age curl; do
            command -v "$binary"
          done
          rclone version | grep -F "rclone v1.72.1"
          rsync --version
          ssh -V
          sshpass -V
          age --version
          curl --version
        '
        
    - name: Run integration tests
      run: |
        # Run container in background
        docker run -d --name dockervault-test \
          -p 8080:80 \
          -v /var/run/docker.sock:/var/run/docker.sock:ro \
          dockervault:test
        
        # Wait for backend liveness through nginx with retries
        echo "Waiting for container to be ready..."
        ready=false
        for i in {1..30}; do
          if health=$(curl -fsS http://localhost:8080/health 2>/dev/null) && \
             [[ "$health" == *'"status":"healthy"'* ]]; then
            echo "Backend is healthy through nginx!"
            ready=true
            break
          fi
          echo "Attempt $i/30 - waiting..."
          sleep 2
        done

        if [ "$ready" != true ]; then
          echo "Backend did not become healthy through nginx"
          docker logs dockervault-test
          exit 1
        fi
        
        # Show container logs for debugging
        echo "=== Container logs ==="
        docker logs dockervault-test
        echo "======================"
        
        # Test frontend serves correctly
        curl -f http://localhost:8080 || exit 1

        # Test backend health directly (internal port)
        docker exec dockervault-test curl -fsS http://localhost:8000/health

        # Test a public API endpoint through the nginx proxy
        curl -fsS http://localhost:8080/api/v1/auth/status
        
    - name: Clean up
      if: always()
      run: |
        docker stop dockervault-test 2>/dev/null || true
        docker rm dockervault-test 2>/dev/null || true
        docker rmi dockervault:test 2>/dev/null || true

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version-file: '.python-version'
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.35.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true
        
    - name: Run pip-audit on Python dependencies
      working-directory: backend
      continue-on-error: true
      run: |
        python -m pip install --upgrade pip==25.3
        pip install pip-audit
        pip-audit -r requirements.txt

    - name: Set up Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version-file: '.node-version'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install pinned npm
      working-directory: frontend
      run: npm install --global "$(node -p "require('./package.json').packageManager")"
        
    - name: Run npm audit on Node dependencies
      working-directory: frontend
      continue-on-error: true
      run: npm audit --audit-level high
