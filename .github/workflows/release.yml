name: Release & Docker Build

on:
  workflow_run:
    workflows: ["Tests"]
    branches: [main, develop]
    types: [completed]
  push:
    branches: [main, develop]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dockervault

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch != 'develop' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      build_env: ${{ steps.version.outputs.build_env }}
      source_ref: ${{ steps.source.outputs.ref }}
      source_sha: ${{ steps.source.outputs.sha }}
      source_name: ${{ steps.source.outputs.name }}
      docker_tags: ${{ steps.docker_meta.outputs.tags }}
      docker_labels: ${{ steps.docker_meta.outputs.labels }}
      native_run: ${{ steps.admission.outputs.native_run }}
      native_attempt: ${{ steps.admission.outputs.native_attempt }}
      native_amd64: ${{ steps.admission.outputs.native_amd64 }}
      native_arm64: ${{ steps.admission.outputs.native_arm64 }}
    steps:
      - name: Select release source
        id: source
        env:
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          SOURCE_REF: ${{ github.event_name == 'workflow_run' && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          case "$SOURCE_REF" in
            refs/heads/main|refs/heads/develop|refs/tags/v*) ;;
            *) exit 1 ;;
          esac
          printf 'sha=%s\nref=%s\nname=%s\n' "$SOURCE_SHA" "$SOURCE_REF" "${SOURCE_REF#refs/*/}" >> "$GITHUB_OUTPUT"
      - name: Require successful Tests and both native architectures on the release SHA
        id: admission
        uses: actions/github-script@v9
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        with:
          script: |
            const {SOURCE_SHA: sha, SOURCE_REF: ref} = process.env;
            const branches = ref.startsWith('refs/tags/v') ? ['main', 'develop'] : [ref.slice('refs/heads/'.length)];
            const repository = {owner: context.repo.owner, repo: context.repo.repo};
            const workflows = ['test.yml', 'rust-native.yml'];
            const completed = runs => runs.every(run => run?.status === 'completed');

            // Develop waits for the full native package tests and upload.
            const tries = ref === 'refs/heads/develop' ? 360 : 120;
            for (let attempt = 0; attempt < tries; attempt++) {
              const runs = await Promise.all(workflows.map(async workflow_id => {
                const {data} = await github.rest.actions.listWorkflowRuns({
                  ...repository, workflow_id, head_sha: sha, event: 'push', per_page: 100
                });
                return data.workflow_runs.find(run =>
                  run.head_sha === sha && run.event === 'push' && branches.includes(run.head_branch));
              }));
              for (const [index, run] of runs.entries()) {
                if (run?.status === 'completed' && run.conclusion !== 'success') {
                  core.setFailed(`${workflows[index]} did not pass for ${sha}: ${run.conclusion}`);
                  return;
                }
              }
              if (completed(runs)) {
                const native = runs[1];
                const develop = ref === 'refs/heads/develop';
                const {data} = develop
                  ? await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs', {
                      ...repository, run_id: native.id, attempt_number: native.run_attempt, per_page: 100
                    })
                  : await github.rest.actions.listJobsForWorkflowRun({
                      ...repository, run_id: native.id, filter: 'latest', per_page: 100
                    });
                for (const arch of ['amd64', 'arm64']) {
                  const name = `Native workspace and offline recovery (${arch})`;
                  const matches = data.jobs.filter(job => job.name === name);
                  if (matches.length !== 1 || matches[0].head_sha !== sha ||
                      matches[0].status !== 'completed' || matches[0].conclusion !== 'success') {
                    core.setFailed(`${name} did not pass for ${sha}`);
                    return;
                  }
                }
                if (develop) {
                  if (context.eventName !== 'push' || context.ref !== ref || context.sha !== sha) {
                    throw new Error('Develop packages require the direct source push');
                  }
                  for (const arch of ['amd64', 'arm64']) {
                    const name = `native-dev-${arch}-${sha}-${native.run_attempt}`;
                    const matches = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                      ...repository, run_id: native.id, name, per_page: 100
                    });
                    if (matches.length !== 1 || matches[0].expired || matches[0].name !== name ||
                        !Number.isSafeInteger(matches[0].id) || matches[0].id <= 0 ||
                        !/^sha256:[0-9a-f]{64}$/.test(matches[0].digest)) {
                      throw new Error(`Missing unique authenticated artifact: ${name}`);
                    }
                    core.setOutput(`native_${arch}`, `${matches[0].id}:${matches[0].digest}`);
                  }
                  core.setOutput('native_run', native.id);
                  core.setOutput('native_attempt', native.run_attempt);
                }
                core.info(`Release validation passed for ${sha}: Tests run ${runs[0].id}, native run ${native.id}`);
                return;
              }
              if (attempt + 1 < tries) await new Promise(resolve => setTimeout(resolve, 15000));
            }
            core.setFailed(`Timed out waiting for successful release validation on ${sha}`);
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.source.outputs.sha }}

      - name: Determine version
        id: version
        env:
          REF: ${{ steps.source.outputs.ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          bash scripts/release-version.sh "$REF" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          context: git
          flavor: latest=${{ steps.source.outputs.ref == 'refs/heads/develop' && 'false' || 'auto' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.ref.name=${{ steps.source.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.source.outputs.name }},enable=${{ startsWith(steps.source.outputs.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.source.outputs.name }},enable=${{ startsWith(steps.source.outputs.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},value=${{ steps.source.outputs.name }},enable=${{ startsWith(steps.source.outputs.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ steps.source.outputs.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ steps.source.outputs.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.source.outputs.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ steps.source.outputs.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.source.outputs.ref == 'refs/heads/develop' }}
            type=sha,prefix=sha-

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      dev_digest: ${{ steps.dev-oci.outputs.digest }}
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Verify both Develop receipts and precompute the multiarch digest
        if: needs.prepare.outputs.source_ref == 'refs/heads/develop'
        id: dev-oci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_RUN: ${{ needs.prepare.outputs.native_run }}
          NATIVE_ATTEMPT: ${{ needs.prepare.outputs.native_attempt }}
          AMD64_ARTIFACT: ${{ needs.prepare.outputs.native_amd64 }}
          ARM64_ARTIFACT: ${{ needs.prepare.outputs.native_arm64 }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAGS: ${{ needs.prepare.outputs.docker_tags }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev$ ]]
          image="${REGISTRY}/${IMAGE_NAME,,}"
          diff <(sort <<< "$TAGS") <(printf '%s\n' "$image:dev" "$image:$VERSION" "$image:sha-${GITHUB_SHA:0:7}" | sort)
          tag="refs/tags/v$VERSION"
          existing=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "$tag" "$tag^{}")
          if [[ -n $existing ]]; then
            test "$(tail -n 1 <<< "$existing" | cut -f1)" = "$GITHUB_SHA"
          fi
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
          dir="$RUNNER_TEMP/dv-promote"
          for arch in amd64 arm64; do
            if [[ $arch == amd64 ]]; then pair=$AMD64_ARTIFACT; else pair=$ARM64_ARTIFACT; fi
            [[ $pair =~ ^([0-9]+):sha256:([0-9a-f]{64})$ ]]
            id=${BASH_REMATCH[1]} expected=${BASH_REMATCH[2]}
            mkdir -p "$dir/$arch"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$dir/$arch.zip"
            printf '%s  %s\n' "$expected" "$dir/$arch.zip" | sha256sum --check
            unzip -q "$dir/$arch.zip" application.oci.tar receipt.json -d "$dir/$arch"
            rm "$dir/$arch.zip"
          done
          digest=$(DV_VERSION="$VERSION" bash docker/native-dev-oci.sh promote "$dir" "$NATIVE_RUN" "$NATIVE_ATTEMPT" "$dir/bound")
          test "sha256:$(skopeo inspect --raw "oci:$dir/bound:bound" | sha256sum | cut -d' ' -f1)" = "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Verified Develop index: %s\n' "$digest"

      - name: Set up QEMU
        if: needs.prepare.outputs.source_ref != 'refs/heads/develop'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: needs.prepare.outputs.source_ref != 'refs/heads/develop'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote only the verified Develop index
        if: needs.prepare.outputs.source_ref == 'refs/heads/develop'
        env:
          TAGS: ${{ needs.prepare.outputs.docker_tags }}
          DIGEST: ${{ steps.dev-oci.outputs.digest }}
        run: |
          set -euo pipefail
          [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/develop && $DIGEST =~ ^sha256:[a-f0-9]{64}$ ]]
          source="oci:$RUNNER_TEMP/dv-promote/bound:bound"
          while IFS= read -r tag; do
            skopeo copy --all --preserve-digests "$source" "docker://$tag"
            test "sha256:$(skopeo inspect --raw "docker://$tag" | sha256sum | cut -d' ' -f1)" = "$DIGEST"
          done <<< "$TAGS"

      - name: Build and push Docker image
        if: needs.prepare.outputs.source_ref != 'refs/heads/develop'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=min
          tags: ${{ needs.prepare.outputs.docker_tags }}
          labels: ${{ needs.prepare.outputs.docker_labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT_SHA=${{ needs.prepare.outputs.source_sha }}
            BRANCH=${{ needs.prepare.outputs.source_name }}
            BUILD_ENV=${{ needs.prepare.outputs.build_env }}

  create-release:
    needs: [prepare, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Create releases for tags, develop and main branch pushes
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Generate Changelog
        id: changelog
        env:
          BRANCH: ${{ needs.prepare.outputs.source_name }}
          DEV_DIGEST: ${{ needs.build-and-push.outputs.dev_digest }}
        run: |
          if [[ $BRANCH == develop ]]; then
            [[ $DEV_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          fi
          CURRENT_VERSION="${{ needs.prepare.outputs.version }}"
          
          # Find the last tag for changelog comparison
          if [[ "$BRANCH" == "develop" ]]; then
            LAST_TAG=$(git tag -l --sort=-creatordate | grep -E '(^vdev\.|.*-dev$)' | head -n1 || echo "")
          else
            LAST_TAG=$(git tag -l 'v*' --sort=-version:refname | grep -vE '(^vdev\.|.*-dev$)' | head -n1 || echo "")
          fi
          
          echo "Branch: $BRANCH"
          echo "Current version: $CURRENT_VERSION"
          echo "Last tag found: $LAST_TAG"
          
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s" --no-merges 2>/dev/null || echo "")
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges -20 2>/dev/null || echo "")
          fi
          
          if [ -n "$COMMITS" ]; then
            echo "content<<EOF" >> $GITHUB_OUTPUT
            echo "### Changes" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "$COMMITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=No changes recorded for this release." >> $GITHUB_OUTPUT
          fi

      - name: Create release notes
        id: notes
        env:
          CHANGELOG_CONTENT: ${{ steps.changelog.outputs.content }}
          DEV_DIGEST: ${{ needs.build-and-push.outputs.dev_digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_ENV: ${{ needs.prepare.outputs.build_env }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          cat > release_notes.md << EOF
          ## What's Changed in ${VERSION}
          
          **Build Environment:** \`${BUILD_ENV}\`
          
          EOF
          
          if [ -n "$CHANGELOG_CONTENT" ]; then
            echo "$CHANGELOG_CONTENT" >> release_notes.md
          else
            echo "No changelog entries for this release." >> release_notes.md
          fi
          
          cat >> release_notes.md << EOF
          
          ---
          
          ## Docker Images
          
          This release is available as multi-architecture Docker images (amd64, arm64):
          
          ### Pull the image:
          \`\`\`bash
          # Specific version
          docker pull ghcr.io/${REPO_OWNER}/dockervault:${VERSION}
          
          # Or latest stable (main branch)
          docker pull ghcr.io/${REPO_OWNER}/dockervault:latest
          
          # Or development (develop branch)
          docker pull ghcr.io/${REPO_OWNER}/dockervault:dev
          \`\`\`
          
          ### Run with Docker Compose:
          \`\`\`bash
          # Download docker-compose.yml
          curl -O https://raw.githubusercontent.com/${REPO}/main/docker-compose.yml
          
          # Start services
          docker compose up -d
          \`\`\`
          
          ## Registry Information
          
          | Property | Value |
          |----------|-------|
          | Registry | GitHub Container Registry (ghcr.io) |
          | Image | \`ghcr.io/${REPO_OWNER}/dockervault\` |
          | Version | \`${VERSION}\` |
          | Environment | \`${BUILD_ENV}\` |
          | Architectures | linux/amd64, linux/arm64 |
          ${DEV_DIGEST:+| Verified OCI index | \`$DEV_DIGEST\` |}
          
          ## Documentation
          
          See the [README.md](https://github.com/${REPO}/blob/main/README.md) for full configuration options.
          EOF
          
          echo "Release notes created"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(needs.prepare.outputs.source_ref, 'refs/tags/') && needs.prepare.outputs.source_name || format('v{0}', needs.prepare.outputs.version) }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          name: ${{ needs.prepare.outputs.is_prerelease == 'true' && format('Development Build {0}', needs.prepare.outputs.version) || format('Release {0}', needs.prepare.outputs.version) }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          make_latest: ${{ needs.prepare.outputs.source_ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
